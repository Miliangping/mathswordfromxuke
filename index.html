<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学常用英文词汇与表达 · 记忆卡</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --ok:#059669; --ok-soft:#ecfdf5; --ok-line:#6ee7b7;
    --bad:#dc2626; --bad-soft:#fef2f2; --bad-line:#fca5a5;
    --star:#b45309; --star-soft:#fffbeb; --star-line:#fcd34d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; line-height:1.55;
    padding-bottom:40px;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 0 14px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:44px;height:44px;border-radius:13px;flex:none;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;box-shadow:0 6px 16px rgba(99,102,241,.35);
  }
  .brand-title{font-size:17px;font-weight:700;letter-spacing:.2px}
  .brand-sub{font-size:12px;color:var(--muted);letter-spacing:.3px}
  .mode-switch{display:flex;background:#e9edf5;border-radius:12px;padding:4px;gap:2px}
  .mode-btn{
    border:0;background:transparent;padding:8px 16px;border-radius:9px;
    font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
    transition:.18s;font-family:inherit;white-space:nowrap;
  }
  .mode-btn.active{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(15,23,42,.09)}

  /* ---------- 首页 ---------- */
  .home-head{margin:14px 0 16px}
  .home-head h2{font-size:20px;font-weight:700}
  .home-head .sub{font-size:13.5px;color:var(--muted);margin-top:4px}
  .chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
  .chapter-card{
    text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:15px 16px;cursor:pointer;font-family:inherit;color:inherit;
    transition:.18s;position:relative;overflow:hidden;
  }
  .chapter-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,#6366f1,#a855f7);opacity:0;transition:.18s;
  }
  .chapter-card:hover{border-color:#c7d2fe;box-shadow:0 8px 22px rgba(79,70,229,.11);transform:translateY(-2px)}
  .chapter-card:hover::before{opacity:1}
  .ch-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .ch-num{
    font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#fff;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    padding:2px 8px;border-radius:6px;white-space:nowrap;
  }
  .ch-learned{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
  .chapter-card.done{background:#fafdfb;border-color:#d1fae5}
  .chapter-card.done .ch-learned{color:var(--ok)}
  .chapter-card.done::before{background:linear-gradient(180deg,#34d399,#10b981);opacity:1}
  .ch-zh{font-size:15.5px;font-weight:700;margin-bottom:3px}
  .ch-en{font-size:12.8px;color:var(--muted);line-height:1.4;min-height:34px}
  .ch-count{
    display:inline-block;margin-top:9px;font-size:11.5px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);padding:2px 9px;border-radius:20px;
  }
  .chapter-card.done .ch-count{color:var(--ok);background:var(--ok-soft)}

  /* ---------- 错词本入口 ---------- */
  .review-card{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:linear-gradient(135deg,#fff7ed,#fef2f2);
    border:1px solid #fed7aa;border-radius:15px;padding:15px 17px;margin-bottom:16px;
    animation:pop .22s ease;
  }
  .review-card.empty{background:#fff;border-color:var(--line)}
  .rc-main{min-width:0;flex:1 1 220px}
  .rc-title{font-size:15px;font-weight:800;color:#9a3412}
  .review-card.empty .rc-title{color:var(--ink)}
  .rc-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .rc-btn{
    flex:none;border:0;border-radius:12px;padding:11px 20px;
    background:#ea580c;color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.16s;
    box-shadow:0 6px 16px rgba(234,88,12,.28);white-space:nowrap;
  }
  .rc-btn:hover{background:#c2410c;transform:translateY(-1px)}
  .rc-btn.sm{padding:10px 18px;font-size:13.5px}

  /* ---------- 熟悉词条管理 ---------- */
  .manager{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .manager summary{
    cursor:pointer;padding:14px 17px;font-size:13.5px;font-weight:700;color:var(--ink);
    list-style:none;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  }
  .manager summary::-webkit-details-marker{display:none}
  .manager summary::before{
    content:"▸";color:var(--accent);transition:transform .18s;display:inline-block;font-size:12px;
  }
  .manager[open] summary::before{transform:rotate(90deg)}
  .manager.wrong summary::before{color:#ea580c}
  .mg-hint{font-size:11.5px;color:var(--muted);font-weight:500}
  .mg-body{padding:2px 14px 14px;border-top:1px solid var(--line)}
  .mg-group{margin-top:14px}
  .mg-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:7px}
  .mg-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;background:#f8fafc;margin-bottom:6px}
  .mg-text{flex:1;min-width:0}
  .mg-zh{font-size:13.5px;font-weight:700;word-break:break-word}
  .mg-en{font-size:12.5px;color:var(--muted);word-break:break-word}
  .mg-restore{
    flex:none;border:1px solid #c7d2fe;background:#fff;color:var(--accent);
    border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .mg-restore:hover{background:var(--accent-soft)}
  .mg-restore.warm{border-color:#fdba74;color:#c2410c}
  .mg-restore.warm:hover{background:#fff7ed}
  .mg-foot{margin-top:15px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .mg-clear{
    border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .mg-clear:hover{border-color:var(--bad-line);color:var(--bad)}
  .err-badge{
    display:inline-block;font-size:10.5px;font-weight:700;color:#b91c1c;
    background:#fee2e2;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;
  }
  .err-badge.once{color:#b45309;background:#fef3c7}

  /* ---------- 答题 ---------- */
  .quiz-top{display:flex;align-items:center;gap:12px;margin:10px 0 10px}
  .back-btn{
    border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s;
    white-space:nowrap;
  }
  .back-btn:hover{border-color:#c7d2fe;color:var(--accent)}
  .quiz-title{font-size:14px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .quiz-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

  .progress{height:6px;background:#e5e9f2;border-radius:99px;overflow:hidden;margin-bottom:20px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:99px;transition:width .3s}
  .progress-fill.review{background:linear-gradient(90deg,#f97316,#ef4444)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:30px 24px;text-align:center;box-shadow:0 10px 28px rgba(15,23,42,.055);
    margin-bottom:16px;
  }
  .card-label{
    font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--accent);
    background:var(--accent-soft);display:inline-block;padding:3px 11px;border-radius:20px;margin-bottom:16px;
  }
  .card-label.review{color:#c2410c;background:#fff7ed}
  .prompt{
    font-size:clamp(20px,4.6vw,30px);font-weight:700;line-height:1.35;
    word-break:break-word;
  }

  .options{display:grid;gap:11px}
  .option{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:#fff;border:1.6px solid var(--line);border-radius:14px;
    padding:14px 16px;cursor:pointer;font-family:inherit;color:inherit;
    font-size:16px;line-height:1.45;transition:.15s;
  }
  .option:not(.disabled):hover{border-color:#a5b4fc;background:#fafaff;transform:translateY(-1px)}
  .badge{
    flex:none;width:26px;height:26px;border-radius:8px;background:#f1f5f9;color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
  }
  .opt-text{flex:1;word-break:break-word}
  .option.correct{border-color:var(--ok-line);background:var(--ok-soft)}
  .option.correct .badge{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
  .option.wrong .badge{background:var(--bad);color:#fff}
  .option.disabled{cursor:default}

  /* ---------- 反馈 ---------- */
  .feedback{
    margin-top:16px;border-radius:16px;padding:18px 20px;
    border:1.5px solid var(--line);background:#fff;animation:pop .22s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .feedback.ok{border-color:var(--ok-line);background:var(--ok-soft)}
  .feedback.bad{border-color:var(--bad-line);background:var(--bad-soft)}
  .fb-head{font-size:15px;font-weight:800;margin-bottom:12px}
  .feedback.ok .fb-head{color:var(--ok)}
  .feedback.bad .fb-head{color:var(--bad)}
  .fb-row{font-size:14.5px;margin-bottom:7px}
  .fb-row.muted{color:var(--muted);font-size:13.5px}
  .fb-pair{font-size:14.5px;margin-top:5px;display:flex;gap:8px;align-items:flex-start}
  .tag{
    flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-top:2px;
    background:#e2e8f0;color:#475569;
  }
  .fb-pair:first-of-type .tag{background:#dbeafe;color:#1d4ed8}
  .fb-pair:nth-of-type(2) .tag{background:#fce7f3;color:#be185d}
  .fb-ex{
    margin-top:13px;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.85);
    border-left:3px solid var(--accent);
  }
  .fb-ex-label{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--accent);margin-bottom:5px}
  .fb-ex .en{font-size:14.5px;font-weight:600;font-style:italic;color:#334155;word-break:break-word}
  .fb-ex .zh{font-size:13.5px;color:var(--muted);margin-top:5px}
  .fb-tip{
    margin-top:12px;font-size:13.5px;color:#7c2d12;background:#fff7ed;
    border-radius:10px;padding:10px 13px;line-height:1.6;
  }
  .fb-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .next-btn{
    flex:1 1 160px;border:0;border-radius:12px;padding:13px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.16s;box-shadow:0 6px 16px rgba(79,70,229,.3);
  }
  .next-btn:hover{background:#4338ca;transform:translateY(-1px)}
  .known-btn{
    flex:0 0 auto;border:1.5px solid var(--star-line);background:var(--star-soft);color:var(--star);
    border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap;
  }
  .known-btn:hover{background:#fef3c7;transform:translateY(-1px)}

  /* ---------- 结算 ---------- */
  .result{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 24px;text-align:center;margin-top:20px}
  .result-emoji{font-size:48px;line-height:1}
  .result h2{font-size:21px;margin:10px 0 8px}
  .result .sub{font-size:13.5px;color:var(--muted);margin-bottom:18px}
  .result-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .result-stats>div{
    background:#f8fafc;border:1px solid var(--line);border-radius:13px;
    padding:12px 18px;min-width:80px;font-size:12.5px;color:var(--muted);font-weight:600;
  }
  .result-stats span{display:block;font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .primary-btn,.ghost-btn{
    border-radius:12px;padding:12px 26px;font-size:14.5px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.16s;
  }
  .primary-btn{border:0;background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
  .primary-btn:hover{background:#4338ca}
  .primary-btn.warm{background:#ea580c;box-shadow:0 6px 16px rgba(234,88,12,.3)}
  .primary-btn.warm:hover{background:#c2410c}
  .ghost-btn{border:1.5px solid var(--line);background:#fff;color:var(--muted)}
  .ghost-btn:hover{border-color:#c7d2fe;color:var(--accent)}

  .wrong-list{margin-top:28px;text-align:left}
  .wrong-list h3{font-size:14px;color:var(--muted);margin-bottom:11px;font-weight:700}
  .wrong-item{
    border:1px solid var(--line);border-left:3px solid var(--bad-line);border-radius:11px;
    padding:11px 14px;margin-bottom:9px;background:#fff;
  }
  .wi-zh{font-size:14.5px;font-weight:700}
  .wi-en{font-size:13.5px;color:var(--muted);margin-top:2px;word-break:break-word}

  @media (max-width:520px){
    .brand-title{font-size:15px}
    .brand-sub{display:none}
    .mode-btn{padding:7px 12px;font-size:12.5px}
    .card{padding:24px 16px}
    .option{font-size:15px;padding:13px 14px}
    .quiz-title{font-size:13px}
    .rc-btn{width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo">∑</div>
      <div>
        <div class="brand-title">数学常用英文词汇与表达</div>
        <div class="brand-sub">Mathematical English for Interviews</div>
      </div>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" data-dir="zh2en">中 → 英</button>
      <button class="mode-btn" data-dir="en2zh">英 → 中</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
/* =========================================================
   数据：章节 / 词条 / 例句 / 提示
   ========================================================= */
const RAW = [
  {
    zh:'通用符号与量词', en:'General Notation and Quantifiers',
    items:[
      ['x∈A','x belongs to A'],
      ['x∉A','x does not belong to A'],
      ['A⊆B','A is a subset of B'],
      ['A⊂B','A is a proper subset of B'],
      ['A∪B','A union B'],
      ['A∩B','A intersection B'],
      ['A\\B','A minus B'],
      ['∅','the empty set'],
      ['{0}','the set containing only zero'],
      ['ℝ','the real numbers'],
      ['ℂ','the complex numbers'],
      ['ℚ','the rational numbers'],
      ['ℤ','the integers'],
      ['ℕ','the natural numbers'],
      ['[a,b]','the closed interval from a to b'],
      ['(a,b)','the open interval from a to b'],
      ['[a,b)','the interval from a, inclusive, to b, exclusive'],
      ['∀x','for every x',{ex:{en:'For every positive epsilon, there exists a positive delta such that the following implication holds.',zh:'对每个正数 ε，存在正数 δ，使下面的蕴含关系成立。'}}],
      ['∃x','there exists an x'],
      ['∃!x','there exists a unique x',{ex:{en:'There exists a unique real number x satisfying this equation.',zh:'存在唯一的实数 x 满足这个方程。'}}],
      ['P→Q','P implies Q'],
      ['P⇔Q','P if and only if Q'],
      ['x≠y','x is not equal to y'],
      ['x≤y','x is less than or equal to y'],
      ['x≥y','x is greater than or equal to y'],
      ['|x|','the absolute value of x'],
      ['‖v‖','the norm of v'],
      ['x²','x squared'],
      ['x³','x cubed'],
      ['x⁴','x to the fourth power'],
      ['x⁻¹','x to the power negative one'],
      ['√x','the square root of x'],
      ['ⁿ√x','the n-th root of x'],
      ['aₙ','a sub n'],
      ['aᵢ','a sub i'],
      ['aₙ₊₁','a sub n plus one',{tip:'aₙ₊₁ 指「下标为 n+1 的项」，口语可说 the term with index n plus one；注意与 aₙ + 1（a sub n, plus one）区分。'}],
      ['(a+b)/n','the quantity a plus b, divided by n'],
      ['n!','n factorial'],
      ['∑(k=1..n) a_k','the sum from k equals one to n of a sub k'],
      ['∏(k=1..n) a_k','the product from k equals one to n of a sub k'],
      ['α, β, γ, δ','alpha, beta, gamma, delta'],
      ['ε, λ, μ, σ','epsilon, lambda, mu, sigma'],
      ['φ, ψ, θ, ω, Ω','phi, psi, theta, omega, capital omega']
    ]
  },
  {
    zh:'定义与证明的常用句型', en:'Definitions and Proofs',
    items:[
      ['定义','definition'],
      ['记号','notation'],
      ['定理','theorem'],
      ['引理','lemma'],
      ['推论','corollary'],
      ['命题','proposition'],
      ['猜想','conjecture'],
      ['假设','assumption / hypothesis',{ex:{en:'We prove the two directions separately. First, assume that the stated condition holds.',zh:'我们分别证明两个方向。首先，假设给定条件成立。'}}],
      ['结论','conclusion'],
      ['充分条件','sufficient condition'],
      ['必要条件','necessary condition',{tip:'「P is sufficient for Q」表示 P ⇒ Q；「P is necessary for Q」表示 Q ⇒ P。不要把 necessary 与 sufficient 的方向说反。'}],
      ['充要条件','necessary and sufficient condition'],
      ['等价','equivalence'],
      ['逆命题','converse'],
      ['逆否命题','contrapositive'],
      ['反例','counterexample'],
      ['矛盾','contradiction',{ex:{en:'This contradicts our assumption, so the proof is complete.',zh:'这与假设矛盾，因此证明完成。'}}],
      ['归纳法','proof by induction',{ex:{en:'By the induction hypothesis, the claim holds for n. We now prove it for n plus one.',zh:'由归纳假设，结论对 n 成立。现在证明它对 n + 1 成立。'}}],
      ['反证法','proof by contradiction',{ex:{en:'Suppose, for a contradiction, that the conclusion is false.',zh:'用反证法，假设结论不成立。'}}],
      ['分类讨论','proof by cases'],
      ['不失一般性','without loss of generality'],
      ['任意的','arbitrary',{ex:{en:'Let epsilon be an arbitrary positive number.',zh:'任取正数 ε。'}}],
      ['固定的','fixed'],
      ['唯一的','unique'],
      ['存在性','existence'],
      ['唯一性','uniqueness'],
      ['良定义的','well-defined'],
      ['平凡的','trivial'],
      ['非平凡的','nontrivial'],
      ['证明','prove / show',{ex:{en:'It suffices to prove that the kernel is trivial.',zh:'只需证明核是平凡的。'}}],
      ['推出','deduce / infer'],
      ['验证','verify / check'],
      ['构造','construct'],
      ['选取','choose / take'],
      ['代入','substitute'],
      ['估计','estimate'],
      ['上界','upper bound'],
      ['下界','lower bound']
    ]
  },
  {
    zh:'分析：极限与连续', en:'Analysis: Limits and Continuity',
    items:[
      ['实数','real number'],
      ['实值函数','real-valued function'],
      ['定义域','domain'],
      ['陪域','codomain'],
      ['像集','image'],
      ['极限','limit'],
      ['趋于','tend to / approach'],
      ['左极限','left-hand limit'],
      ['右极限','right-hand limit'],
      ['有限极限','finite limit'],
      ['无穷极限','infinite limit'],
      ['有界','bounded'],
      ['无界','unbounded'],
      ['有上界','bounded above'],
      ['有下界','bounded below'],
      ['上确界','supremum',{tip:'supremum 是最小上界，未必被取到；maximum 必须在集合中取到。可以说 E has supremum one，不能在尚未取到时说 E has maximum one。'}],
      ['下确界','infimum'],
      ['最大值','maximum',{ex:{en:'Since the interval is compact and the function is continuous, it attains its maximum and minimum.',zh:'因为区间是紧的且函数连续，它能取到最大值与最小值。'}}],

/* 展开成对象结构 */
const CHAPTERS = RAW.map((c, ci) => ({
  zh: c.zh,
  en: c.en,
  index: ci,
  entries: c.items.map(([zh, en, extra]) => Object.assign({ zh, en }, extra || {}))
}));

/* 全局词条池（兜底干扰项） */
const ALL_ENTRIES = [];
CHAPTERS.forEach(c => c.entries.forEach(e => ALL_ENTRIES.push(e)));

/* =========================================================
   工具函数
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   「非常熟悉」存储（localStorage 持久化）
   ========================================================= */
const STORE_KEY = 'mathEnglish.learned.v1';
let learned = {};
try {
  const raw = localStorage.getItem(STORE_KEY);
  learned = raw ? (JSON.parse(raw) || {}) : {};
  if (typeof learned !== 'object' || Array.isArray(learned)) learned = {};
} catch (e) { learned = {}; }

function saveLearned(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(learned)); } catch (e) {}
}

/* 章节的全部词条（含章节标题本身） */
function chapterAllItems(idx){
  const ch = CHAPTERS[idx];
  return [{ zh: ch.zh, en: ch.en, _isTitle: true }].concat(ch.entries);
}
function validZhSet(idx){
  return new Set(chapterAllItems(idx).map(e => e.zh));
}
function isLearned(idx, zh){
  const arr = learned[String(idx)];
  return !!(arr && arr.indexOf(zh) !== -1);
}
function markLearned(idx, zh){
  const k = String(idx);
  if (!learned[k]) learned[k] = [];
  if (learned[k].indexOf(zh) === -1){ learned[k].push(zh); saveLearned(); }
}
function unmarkLearned(idx, zh){
  const k = String(idx);
  if (!learned[k]) return;
  learned[k] = learned[k].filter(z => z !== zh);
  if (!learned[k].length) delete learned[k];
  saveLearned();
}
function learnedCount(idx){
  const arr = learned[String(idx)] || [];
  const valid = validZhSet(idx);
  return arr.filter(z => valid.has(z)).length;
}
function totalLearned(){
  let n = 0;
  CHAPTERS.forEach((c, i) => { n += learnedCount(i); });
  return n;
}
function learnedItemsOf(idx){
  return chapterAllItems(idx).filter(e => isLearned(idx, e.zh));
}

/* =========================================================
   ★ 错词本存储（新增）
   ========================================================= */
const WRONG_KEY = 'mathEnglish.wrongbook.v1';
let wrongBook = {};   /* key = "章节号||中文" -> {ch, zh, count, streak, lastAt} */

try {
  const rawW = localStorage.getItem(WRONG_KEY);
  wrongBook = rawW ? (JSON.parse(rawW) || {}) : {};
  if (typeof wrongBook !== 'object' || Array.isArray(wrongBook)) wrongBook = {};
} catch (e) { wrongBook = {}; }

function saveWrong(){
  try { localStorage.setItem(WRONG_KEY, JSON.stringify(wrongBook)); } catch (e) {}
}
function wbKey(chIdx, zh){ return chIdx + '||' + zh; }

/* 答错：记入错词本；已存在则累加错误次数并重置连对计数 */
function addWrong(chIdx, zh){
  if (chIdx === null || chIdx === undefined) return;
  const k = wbKey(chIdx, zh);
  if (wrongBook[k]){
    wrongBook[k].count += 1;
    wrongBook[k].streak = 0;
    wrongBook[k].lastAt = Date.now();
  } else {
    wrongBook[k] = { ch: chIdx, zh: zh, count: 1, streak: 0, lastAt: Date.now() };
  }
  saveWrong();
}

/* 答对 / 标记熟悉：移出错词本 */
function removeWrong(chIdx, zh){
  const k = wbKey(chIdx, zh);
  if (wrongBook[k]){ delete wrongBook[k]; saveWrong(); }
}

function wrongTotal(){
  return Object.keys(wrongBook).filter(k => CHAPTERS[wrongBook[k].ch]).length;
}
function wrongCountOf(chIdx, zh){
  const e = wrongBook[wbKey(chIdx, zh)];
  return e ? e.count : 0;
}

/* 按 (章节, 中文) 反查词条对象 */
function lookupEntry(chIdx, zh){
  const ch = CHAPTERS[chIdx];
  if (!ch) return null;
  if (ch.zh === zh) return { zh: ch.zh, en: ch.en, _isTitle: true };
  return ch.entries.find(e => e.zh === zh) || null;
}

/* =========================================================
   状态
   ========================================================= */
const state = {
  dir: 'zh2en',
  mode: 'chapter',        /* 'chapter' | 'review' */
  chapter: null,
  reviewRound: 1,
  queue: [],              /* 元素: {entry, chIdx} */
  pos: 0,
  answered: false,
  correct: 0,
  wrong: 0,
  wrongItems: [],
  question: null,
  manageOpen: false,
  manageWrongOpen: false
};

const view = document.getElementById('view');

/* =========================================================
   出题
   ========================================================= */
function buildOptions(item, pool){
  const key = state.dir === 'zh2en' ? 'en' : 'zh';
  const correctText = item[key];
  const used = new Set([correctText]);
  const picks = [];

  const tryAdd = cands => {
    for (const e of cands){
      if (picks.length >= 3) return;
      const t = e[key];
      if (!t || used.has(t)) continue;
      used.add(t);
      picks.push({ text: t, entry: e });
    }
  };

  const primary = (pool && pool.length) ? pool : ALL_ENTRIES;
  tryAdd(shuffle(primary.filter(e => e !== item)));
  if (picks.length < 3) tryAdd(shuffle(ALL_ENTRIES.filter(e => e !== item)));

  return shuffle([{ text: correctText, entry: item }].concat(picks));
}

    .map(k => wrongBook[k])
    .filter(w => CHAPTERS[w.ch])
    .sort((a, b) => (b.count - a.count) || (a.ch - b.ch));

  const rows = list.map(w => {

      <div class="mg-text">

        <div class="mg-en">${esc(e.en)} · 第 ${w.ch + 1} 章</div>

    </div>`;
  }).join('');

  return `<details class="manager wrong" id="wrong-manager" ${state.manageWrongOpen ? 'open' : ''}>

function managerHTML(){
  const groups = CHAPTERS.map((c, i) => {
    const items = learnedItemsOf(i);

    return `<div class="mg-group">
      <div class="mg-title">第 ${i + 1} 章 · ${esc(c.zh)}（${items.length}）</div>

            <div class="mg-zh">${esc(e.zh)}</div>

  return `<details class="manager" id="manager" ${state.manageOpen ? 'open' : ''}>

    <div class="mg-body">
      ${groups}
      <div class="mg-foot"><button class="mg-clear" data-act="clear-all">清空全部熟悉标记</button></div>

/* =========================================================
   开始章节练习
   ========================================================= */
function startChapter(idx){
  const ch = CHAPTERS[idx];
  state.mode = 'chapter';
  state.chapter = ch;

  const all = chapterAllItems(idx);
  const remain = all.filter(it => !isLearned(idx, it.zh));

  if (!remain.length){
    renderAllLearned(ch);
    return;
  }

  state.queue = shuffle(remain).map(entry => ({ entry, chIdx: idx }));
  state.pos = 0;
  state.correct = 0;
  state.wrong = 0;
  state.wrongItems = [];
  state.question = null;
  renderQuiz();
}

/* =========================================================
   ★ 错词复习（多轮）
   ========================================================= */
function buildReviewQueue(){
  const queue = [];
  Object.keys(wrongBook).forEach(k => {
    const w = wrongBook[k];
    const e = lookupEntry(w.ch, w.zh);
    if (e) queue.push({ entry: e, chIdx: w.ch });
  });
  return shuffle(queue);
}

function beginReviewRound(queue, round){
  state.mode = 'review';
  state.chapter = null;
  state.reviewRound = round;
  state.queue = queue;
  state.pos = 0;
  state.correct = 0;
  state.wrong = 0;
  state.wrongItems = [];
  state.question = null;
  renderQuiz();
}

function startReview(){
  const q = buildReviewQueue();
  if (!q.length) return;
  beginReviewRound(q, 1);
}

/* =========================================================
   渲染题目
   ========================================================= */
function renderQuiz(){
  const q = state.queue[state.pos];
  const entry = q.entry;
  const chIdx = q.chIdx;
  const key = state.dir === 'zh2en' ? 'en' : 'zh';
  const promptKey = state.dir === 'zh2en' ? 'zh' : 'en';

  const pool = CHAPTERS[chIdx] ? CHAPTERS[chIdx].entries : ALL_ENTRIES;
  const options = buildOptions(entry, pool);

  state.question = {
    entry,
    chIdx,
    prompt: entry[promptKey],
    answerText: entry[key],
    options
  };
  state.answered = false;

  const total = state.queue.length;
  const pct = (state.pos / total) * 100;
  const isReview = state.mode === 'review';

  const title = isReview
    ? `错词复习 · 第 ${state.reviewRound} 轮`
    : `第 ${state.chapter.index + 1} 章 · ${esc(state.chapter.zh)}`;

  view.innerHTML = `
    <div class="quiz-top">
      <button class="back-btn" data-act="back">← 返回</button>
      <div class="quiz-title">${title}</div>
      <div class="quiz-count">${state.pos + 1} / ${total}</div>
    </div>
    <div class="progress"><div class="progress-fill${isReview ? ' review' : ''}" style="width:${pct}%"></div></div>

    <div class="card">
      <div class="card-label${isReview ? ' review' : ''}">${entry._isTitle ? '章节标题 · ' : ''}${isReview ? '错词复习 · ' : ''}${state.dir === 'zh2en' ? '选出对应的英文' : '选出对应的中文'}</div>
      <div class="prompt">${esc(state.question.prompt)}</div>
    </div>

    <div class="options">
      ${options.map((o, i) => `
        <button class="option" data-opt="${i}">
          <span class="badge">${'ABCD'[i]}</span>
          <span class="opt-text">${esc(o.text)}</span>
        </button>`).join('')}
    </div>

    <div id="feedback"></div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   选择答案
   ========================================================= */
function selectOption(idx){
  if (state.answered || !state.question) return;
  const q = state.question;
  if (idx < 0 || idx >= q.options.length) return;
  state.answered = true;

  const chosen = q.options[idx];
  const isRight = chosen.text === q.answerText;

  const entry = q.entry;
  const chIdx = q.chIdx;

  if (isRight){
    state.correct++;
    /* ★ 复习模式下答对 → 移出错词本 */
    if (state.mode === 'review') removeWrong(chIdx, entry.zh);
  } else {
    state.wrong++;
    state.wrongItems.push(entry);
    /* ★ 答错 → 记入错词本（累计错误次数） */
    addWrong(chIdx, entry.zh);
  }

  const btns = view.querySelectorAll('.option');
  btns.forEach((b, i) => {
    b.classList.add('disabled');
    if (q.options[i].text === q.answerText) b.classList.add('correct');
    if (i === idx && !isRight) b.classList.add('wrong');
  });

  let html = `<div class="feedback ${isRight ? 'ok' : 'bad'}">
      <div class="fb-head">${isRight ? '✓ 回答正确' : '✗ 回答错误'}</div>`;

  if (!isRight){
    html += `<div class="fb-row">正确答案：<b>${esc(q.answerText)}</b></div>`;
    const wrongEntry = chosen.entry;
    const otherSide = state.dir === 'zh2en' ? wrongEntry.zh : wrongEntry.en;
    html += `<div class="fb-row muted">你选了「${esc(chosen.text)}」，它对应的是「${esc(otherSide)}」</div>`;
    const c = wrongCountOf(chIdx, entry.zh);
    html += `<div class="fb-row muted">已加入错词本 · 该词累计错 ${c} 次${c > 1 ? '，将在后续轮次继续出现' : ''}</div>`;
  } else if (state.mode === 'review'){
    html += `<div class="fb-row muted">已从错词本中移除 ✓</div>`;
  }

  html += `<div class="fb-pair"><span class="tag">中</span><span>${esc(entry.zh)}</span></div>`;
  html += `<div class="fb-pair"><span class="tag">英</span><span>${esc(entry.en)}</span></div>`;

  if (entry.ex){
    html += `<div class="fb-ex">
        <div class="fb-ex-label">例 句</div>
        <div class="en">${esc(entry.ex.en)}</div>
        <div class="zh">${esc(entry.ex.zh)}</div>
      </div>`;
  }
  if (entry.tip){
    html += `<div class="fb-tip"><b>提示：</b>${esc(entry.tip)}</div>`;
  }

  const isLast = state.pos + 1 >= state.queue.length;
  html += `<div class="fb-actions">
      <button class="next-btn" data-act="next">${isLast ? (state.mode === 'review' ? '结束本轮 →' : '查看结果 →') : '继续 →'}</button>
      <button class="known-btn" data-act="known" title="标记后该词条将不再出现在练习中，并从错词本移除">⭐ 非常熟悉</button>
    </div></div>`;

  document.getElementById('feedback').innerHTML = html;

  const fb = document.querySelector('.feedback');
  if (fb) fb.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* =========================================================
   下一题 / 结算
   ========================================================= */
function nextCard(){
  state.pos++;
  if (state.pos >= state.queue.length){
    if (state.mode === 'review') renderReviewRoundEnd();
    else renderResult();
  } else {
    renderQuiz();
  }
}

/* ---------- 章节结算 ---------- */
function renderResult(){
  state.question = null;
  const total = state.queue.length;
  const acc = total ? Math.round((state.correct / total) * 100) : 0;
  const emoji = acc >= 90 ? '🎉' : acc >= 60 ? '👍' : '💪';
  const chIdx = state.chapter.index;
  const all = state.chapter.entries.length + 1;
  const lc = learnedCount(chIdx);
  const wt = wrongTotal();

  view.innerHTML = `
    <div class="result">
      <div class="result-emoji">${emoji}</div>
      <h2>第 ${chIdx + 1} 章 · ${esc(state.chapter.zh)}</h2>
      <p class="sub">本章已标记熟悉 ${lc} / ${all} 个词条${state.wrongItems.length ? ' · 本轮错词已加入错词本' : ''}</p>
      <div class="result-stats">
        <div><span>${total}</span>本次词条</div>
        <div><span>${state.correct}</span>正确</div>
        <div><span>${state.wrong}</span>错误</div>
        <div><span>${acc}%</span>正确率</div>
      </div>
      <div class="result-actions">
        <button class="primary-btn" data-act="again">再练一遍</button>
        ${wt ? `<button class="primary-btn warm" data-act="start-review">复习错词（${wt}）</button>` : ''}
        <button class="ghost-btn" data-act="back">返回章节</button>
      </div>
      ${state.wrongItems.length ? `
        <div class="wrong-list">
          <h3>本轮错词（${state.wrongItems.length}）· 已加入错词本</h3>
          ${state.wrongItems.map(w => {
            const c = wrongCountOf(chIdx, w.zh);
            return `
            <div class="wrong-item">
              <div class="wi-zh">${esc(w.zh)}${c ? `<span class="err-badge${c > 1 ? '' : ' once'}">累计错 ${c} 次</span>` : ''}</div>
              <div class="wi-en">${esc(w.en)}</div>
            </div>`;
          }).join('')}
        </div>` : ''}
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 错词复习：一轮结束 ---------- */
function renderReviewRoundEnd(){
  state.question = null;
  const round = state.reviewRound;
  const total = state.queue.length;
  const acc = total ? Math.round((state.correct / total) * 100) : 0;
  const remainList = Object.keys(wrongBook).map(k => wrongBook[k]).filter(w => CHAPTERS[w.ch]);

  /* 全部掌握 */
  if (!remainList.length){
    view.innerHTML = `
      <div class="result">
        <div class="result-emoji">🏆</div>
        <h2>错词已全部掌握！</h2>
        <p class="sub">共完成 ${round} 轮复习 · 本轮 ${total} 个词条，答对 ${state.correct} 个</p>
        <div class="result-stats">
          <div><span>${round}</span>复习轮次</div>
          <div><span>${total}</span>本轮词条</div>
          <div><span>${acc}%</span>本轮正确率</div>
          <div><span>0</span>剩余错词</div>
        </div>
        <div class="result-actions">
          <button class="primary-btn" data-act="back">返回首页</button>
        </div>
      </div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  /* 仍有错词 → 进入下一轮 */
  const items = remainList
    .map(w => {
      const e = lookupEntry(w.ch, w.zh) || { zh: w.zh, en: '' };
      return { zh: e.zh, en: e.en, count: w.count, ch: w.ch };
    })
    .sort((a, b) => (b.count - a.count) || (a.ch - b.ch));

  view.innerHTML = `
    <div class="result">
      <div class="result-emoji">📚</div>
      <h2>第 ${round} 轮复习完成</h2>
      <p class="sub">本轮 ${total} 个词条 · 答对 ${state.correct} 个 · 还有 <b>${remainList.length}</b> 个需要继续巩固</p>
      <div class="result-stats">
        <div><span>${total}</span>本轮词条</div>
        <div><span>${state.correct}</span>答对（已移出）</div>
        <div><span>${remainList.length}</span>留到下一轮</div>
        <div><span>${acc}%</span>本轮正确率</div>
      </div>
      <div class="result-actions">
        <button class="primary-btn warm" data-act="review-next-round">继续第 ${round + 1} 轮（${remainList.length} 个）→</button>
        <button class="ghost-btn" data-act="back">返回首页</button>
      </div>
      <div class="wrong-list">
        <h3>待巩固词条（${items.length}）</h3>
        ${items.map(w => `
          <div class="wrong-item">
            <div class="wi-zh">${esc(w.zh)}<span class="err-badge${w.count > 1 ? '' : ' once'}">累计错 ${w.count} 次</span></div>
            <div class="wi-en">${esc(w.en)} · 第 ${w.ch + 1} 章</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   整章已熟悉
   ========================================================= */
function renderAllLearned(ch){
  const all = ch.entries.length + 1;
  view.innerHTML = `
    <div class="quiz-top">
      <button class="back-btn" data-act="back">← 章节</button>
      <div class="quiz-title">第 ${ch.index + 1} 章 · ${esc(ch.zh)}</div>
    </div>
    <div class="result">
      <div class="result-emoji">🌟</div>
      <h2>本章 ${all} 个词条已全部标记为「非常熟悉」</h2>
      <p class="sub">它们不会出现在练习中。若想重新练习，可恢复本章词条或前往管理面板单独恢复。</p>
      <div class="result-actions">
        <button class="primary-btn" data-act="restore-ch">恢复本章词条</button>
        <button class="ghost-btn" data-act="back">返回章节</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   事件绑定
   ========================================================= */
view.addEventListener('click', e => {
  /* 恢复单个熟悉词条 */
  const rBtn = e.target.closest('[data-restore]');
  if (rBtn){
    const raw = rBtn.getAttribute('data-restore');
    const sep = raw.indexOf('|');
    unmarkLearned(Number(raw.slice(0, sep)), decodeURIComponent(raw.slice(sep + 1)));
    renderHome();
    return;
  }

  /* 从错词本移除单个词 */
  const wBtn = e.target.closest('[data-wrong-remove]');
  if (wBtn){
    const raw = wBtn.getAttribute('data-wrong-remove');
    const sep = raw.indexOf('|');
    removeWrong(Number(raw.slice(0, sep)), decodeURIComponent(raw.slice(sep + 1)));
    renderHome();
    return;
  }

  /* 进入章节 */
  const chBtn = e.target.closest('[data-ch]');
  if (chBtn){ startChapter(Number(chBtn.dataset.ch)); return; }

  /* 选择选项 */
  const optBtn = e.target.closest('[data-opt]');
  if (optBtn){ selectOption(Number(optBtn.dataset.opt)); return; }

  /* 操作按钮 */
  const actBtn = e.target.closest('[data-act]');
  if (actBtn){
    const a = actBtn.dataset.act;

    if (a === 'back'){ renderHome(); return; }

    if (a === 'next'){ nextCard(); return; }

    if (a === 'known'){
      if (state.question){
        const { entry, chIdx } = state.question;
        if (chIdx !== null && chIdx !== undefined){
          markLearned(chIdx, entry.zh);
          removeWrong(chIdx, entry.zh);   /* ★ 标记熟悉即移出错词本 */
        }
      }
      nextCard();
      return;
    }

    if (a === 'again'){ startChapter(state.chapter.index); return; }

    if (a === 'start-review'){ startReview(); return; }

    if (a === 'review-next-round'){
      const q = buildReviewQueue();
      if (q.length) beginReviewRound(q, state.reviewRound + 1);
      else renderHome();
      return;
    }

    if (a === 'restore-ch'){
      const items = learnedItemsOf(state.chapter.index);
      items.forEach(it => unmarkLearned(state.chapter.index, it.zh));
      renderHome();
      return;
    }

    if (a === 'clear-wrong'){
      if (confirm('确定要清空错词本吗？所有错词将不再出现在复习中。')){
        wrongBook = {};
        saveWrong();
        renderHome();
      }
      return;
    }

    if (a === 'clear-all'){
      if (confirm('确定要清空所有「非常熟悉」标记吗？所有词条将重新进入练习。')){
        learned = {};
        saveLearned();
        renderHome();
      }
      return;
    }
  }
});

/* 记住管理面板的展开状态 */
view.addEventListener('toggle', e => {
  if (!e.target) return;
  if (e.target.id === 'manager') state.manageOpen = e.target.open;
  if (e.target.id === 'wrong-manager') state.manageWrongOpen = e.target.open;
}, true);

/* 记忆模式切换 */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.dir;
    if (dir === state.dir) return;
    state.dir = dir;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    if (state.question && !state.answered) renderQuiz();
    else renderHome();
  });
});

/* 键盘快捷键：1~4 选择，Enter / 空格 继续 */
document.addEventListener('keydown', e => {
  if (!state.question) return;
  if (e.key >= '1' && e.key <= '4' && !state.answered){
    selectOption(Number(e.key) - 1);
  } else if ((e.key === 'Enter' || e.key === ' ') && state.answered){
    e.preventDefault();
    nextCard();
  }
});

/* 启动 */
renderHome();
</script>
</body>
</html>
